
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNI - CLOZ Scanner</title>

<!-- ZXing Barcode Scanner -->
<script src="https://unpkg.com/@zxing/browser@latest"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f4f4f4;
  font-family: Arial, sans-serif;
  color: #171717;
  text-align: center;
}

.card {
  max-width: 500px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 3px 15px #0000000d;
}

h2 {
  letter-spacing: 2px;
  margin-bottom: 8px;
}

p {
  color: #777;
  font-size: 13px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: 0;
  border-radius: 9px;
  background: #171717;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#closeBtn {
  background: #b42318;
}

#copyBtn {
  background: #777;
}

#resetBtn {
  background: #b99b62;
  color: #171717;
}

input {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 16px;
  text-align: center;
  direction: ltr;
  background: #fafafa;
}

#reader {
  width: 100%;
  margin-top: 20px;
  overflow: hidden;
  border-radius: 10px;
  background: #111;
}

#reader video {
  display: block;
  width: 100%;
  height: auto;
  min-height: 220px;
  object-fit: contain;
}

#status {
  margin-top: 20px;
  line-height: 2;
  overflow-wrap: anywhere;
  font-size: 14px;
  font-weight: bold;
}

.footer {
  margin-top: 20px;
  color: #999;
  font-size: 11px;
}
</style>
</head>

<body>

<div class="card">

  <h2>UNI - CLOZ</h2>
  <p>WAREHOUSE BARCODE SCANNER</p>

  <button id="scanBtn" onclick="startScanner()">
    فتح الكاميرا
  </button>

  <button id="closeBtn" onclick="closeScanner()">
    إغلاق الكاميرا
  </button>

  <div id="reader"></div>

  <input
    id="result"
    placeholder="الباركود المقروء"
    readonly
  >

  <button id="copyBtn" onclick="copyCode()">
    نسخ الكود
  </button>

  <button id="resetBtn" onclick="resetScanner()">
    مسح وإعادة المحاولة
  </button>

  <div id="status">جاهز للمسح</div>

  <div class="footer">
    UNI - CLOZ | INVENTORY SYSTEM
  </div>

</div>

<script>

let codeReader = null;
let cameraControls = null;
let scannedCode = '';
let busy = false;
let starting = false;

const resultInput = document.getElementById('result');
const statusBox = document.getElementById('status');
const scanBtn = document.getElementById('scanBtn');

function statusText(message) {
  statusBox.textContent = message;
}

async function startScanner() {

  if (starting || cameraControls) return;

  if (!window.isSecureContext) {
    statusText('الكاميرا تحتاج اتصال HTTPS آمن');
    return;
  }

  if (!window.ZXingBrowser ||
      !ZXingBrowser.BrowserMultiFormatReader) {
    statusText('تعذر تحميل مكتبة ZXing. تحقق من الإنترنت.');
    return;
  }

  starting = true;
  busy = false;
  scanBtn.disabled = true;

  statusText('جاري تجهيز قارئ الباركود...');

  const readerArea = document.getElementById('reader');
  readerArea.innerHTML = '';

  const video = document.createElement('video');
  video.setAttribute('playsinline', 'true');
  video.setAttribute('autoplay', 'true');
  video.muted = true;

  readerArea.appendChild(video);

  try {

    codeReader = new ZXingBrowser.BrowserMultiFormatReader();

    statusText('جاري تشغيل الكاميرا...');

    const controls = await codeReader.decodeFromConstraints(
      {
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      },
      video,
      async function(result, error) {

        if (!result || busy || !cameraControls) return;

        busy = true;

        scannedCode = result.getText().trim();
        resultInput.value = scannedCode;

        statusText('تمت قراءة الباركود بنجاح ✅');

        await closeScanner(true);
      }
    );

    cameraControls = controls;

    statusText('وجه الكاميرا إلى الباركود');

  } catch (error) {

    if (cameraControls) {
      try {
        cameraControls.stop();
      } catch (e) {}
    }

    cameraControls = null;
    codeReader = null;

    readerArea.innerHTML = '';

    scanBtn.disabled = false;

    statusText('تعذر تشغيل الكاميرا: ' +
      (error.message || error));

  } finally {
    starting = false;
  }
}

async function closeScanner(fromScan = false) {

  const controls = cameraControls;

  cameraControls = null;

  if (controls) {
    try {
      controls.stop();
    } catch (error) {}
  }

  if (codeReader) {
    try {
      codeReader.reset();
    } catch (error) {}
  }

  codeReader = null;

  document.getElementById('reader').innerHTML = '';

  scanBtn.disabled = false;
  scanBtn.textContent = 'فتح الكاميرا';

  if (fromScan) {
    statusText('تمت القراءة وإغلاق الكاميرا بنجاح ✅');
  } else if (scannedCode) {
    statusText('تم إغلاق الكاميرا بنجاح ✅');
  } else {
    statusText('تم إغلاق الكاميرا');
  }
}

async function copyCode() {

  if (!scannedCode) {
    statusText('امسح باركود أولاً');
    return;
  }

  try {

    await navigator.clipboard.writeText(scannedCode);
    statusText('تم نسخ الكود بنجاح ✅');

  } catch (error) {

    resultInput.focus();
    resultInput.select();

    statusText('حدد الكود واضغط نسخ من جهازك');

  }
}

async function resetScanner() {

  await closeScanner();

  scannedCode = '';
  busy = false;

  resultInput.value = '';

  scanBtn.disabled = false;
  scanBtn.textContent = 'فتح الكاميرا';

  statusText('جاهز لمسح باركود جديد');
}

window.addEventListener('pagehide', function() {
  if (cameraControls) {
    cameraControls.stop();
    cameraControls = null;
  }
});

</script>

</body>
</html>

 
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNI - CLOZ Scanner Test</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #f4f4f4;
  font-family: Arial, sans-serif;
  text-align: center;
  color: #171717;
}

.card {
  max-width: 500px;
  margin: 25px auto;
  background: white;
  padding: 22px;
  border-radius: 16px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: 0;
  border-radius: 9px;
  background: #171717;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

#closeBtn { background: #b42318; }
#copyBtn { background: #777; }
#resetBtn { background: #b99b62; color: #171717; }

input {
  width: 100%;
  padding: 16px;
  margin-top: 18px;
  border: 1px solid #ddd;
  border-radius: 9px;
  text-align: center;
  direction: ltr;
  font-size: 16px;
}

video {
  width: 100%;
  margin-top: 20px;
  background: #111;
  border-radius: 10px;
}

#status {
  margin-top: 20px;
  line-height: 1.8;
  overflow-wrap: anywhere;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="card">

<h2>UNI - CLOZ</h2>
<p>BARCODE READER TEST</p>

<button id="scanBtn" onclick="startScanner()">فتح الكاميرا</button>
<button id="closeBtn" onclick="closeScanner()">إغلاق الكاميرا</button>

<video id="video" autoplay playsinline muted></video>

<input id="result" placeholder="الباركود المقروء" readonly>

<button id="copyBtn" onclick="copyCode()">نسخ الكود</button>
<button id="resetBtn" onclick="resetScanner()">مسح وإعادة المحاولة</button>

<div id="status">جاهز للمسح</div>

</div>

<script>
let reader = null;
let controls = null;
let scannedCode = '';
let busy = false;
let starting = false;

const video = document.getElementById('video');
const resultInput = document.getElementById('result');
const statusBox = document.getElementById('status');
const scanBtn = document.getElementById('scanBtn');

function statusText(text) {
  statusBox.textContent = text;
}

async function startScanner() {

  if (starting || controls) return;

  if (!window.ZXingBrowser ||
      !ZXingBrowser.BrowserMultiFormatReader) {
    statusText('مكتبة ZXing لم يتم تحميلها. تحقق من الإنترنت.');
    return;
  }

  starting = true;
  busy = false;
  scanBtn.disabled = true;

  statusText('جاري تشغيل الكاميرا...');

  try {

    reader = new ZXingBrowser.BrowserMultiFormatReader();

    const newControls = await reader.decodeFromVideoDevice(
      undefined,
      video,
      async (result, error, scanControls) => {

        // استلام أدوات التحكم من callback نفسه
        if (scanControls && !controls) {
          controls = scanControls;
        }

        if (result && !busy) {

          busy = true;

          scannedCode = result.getText().trim();
          resultInput.value = scannedCode;

          statusText('تمت القراءة بنجاح ✅: ' + scannedCode);

          await closeScanner(true);
        }
      }
    );

    if (!controls) {
      controls = newControls;
    }

    statusText('الكاميرا تعمل. وجّهها إلى الباركود.');

  } catch (error) {

    statusText('خطأ: ' + (error.message || error));
    scanBtn.disabled = false;

    if (controls) {
      controls.stop();
      controls = null;
    }

    reader = null;

  } finally {
    starting = false;
  }
}

async function closeScanner(fromScan = false) {

  if (controls) {
    try {
      controls.stop();
    } catch (e) {}
  }

  controls = null;

  if (reader) {
    try {
      reader.reset();
    } catch (e) {}
  }

  reader = null;

  video.pause();
  video.srcObject = null;

  scanBtn.disabled = false;

  statusText(
    fromScan
      ? 'تمت القراءة وإغلاق الكاميرا بنجاح ✅'
      : 'تم إغلاق الكاميرا'
  );
}

async function copyCode() {

  if (!scannedCode) {
    statusText('امسح باركود أولاً');
    return;
  }

  try {
    await navigator.clipboard.writeText(scannedCode);
    statusText('تم نسخ الكود بنجاح ✅');
  } catch (e) {
    resultInput.select();
    statusText('حدد الكود وانسخه يدوياً');
  }
}

async function resetScanner() {

  await closeScanner();

  scannedCode = '';
  busy = false;
  resultInput.value = '';

  statusText('جاهز للمسح من جديد');
}

window.addEventListener('pagehide', () => {
  if (controls) controls.stop();
});
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNI - CLOZ Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;background:#f4f4f4;
  font-family:Arial,sans-serif;color:#171717;text-align:center
}
.card{
  max-width:500px;margin:30px auto;background:white;
  padding:25px;border-radius:16px
}
h2{letter-spacing:2px}
p{color:#777}
button{
  width:100%;padding:16px;margin-top:12px;
  border:0;border-radius:9px;background:#171717;
  color:white;font-size:16px;font-weight:bold
}
input{
  width:100%;padding:15px;margin-top:15px;
  border:1px solid #ddd;border-radius:9px;
  font-size:16px;text-align:center;direction:ltr
}
#reader{margin-top:20px}
#status{margin-top:20px;line-height:2;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="card">
<h2>UNI - CLOZ</h2>
<p>WAREHOUSE BARCODE SCANNER</p>

<button onclick="startScanner()">فتح الكاميرا</button>
<div id="reader"></div>

<input id="result" placeholder="الباركود المقروء" readonly>

<button onclick="sendCode()">إرسال الكود للنظام</button>
<button onclick="copyCode()" style="background:#777">نسخ الكود</button>

<div id="status">جاهز للمسح</div>
</div>

<script>
let scanner=null;
let scannedCode='';
let busy=false;

async function startScanner(){
 if(scanner)return;

 if(!window.isSecureContext){
  statusText('الكاميرا تحتاج اتصال HTTPS آمن');
  return;
 }

 scanner=new Html5Qrcode('reader');

 try{
  await scanner.start(
   {facingMode:'environment'},
   {fps:10,qrbox:{width:260,height:130}},
   async code=>{
    if(busy)return;
    busy=true;
    scannedCode=code.trim().toUpperCase();
    document.getElementById('result').value=scannedCode;
    statusText('تم قراءة الباركود بنجاح ✅');

    await scanner.stop();
    scanner=null;
    busy=false;
   },
   ()=>{}
  );
 }catch(e){
  scanner=null;
  statusText('تعذر فتح الكاميرا: '+e);
 }
}

function sendCode(){
 if(!scannedCode){
  statusText('امسح باركود أولاً');
  return;
 }

 if(window.opener && !window.opener.closed){
  window.opener.postMessage(
   {type:'UNICLOZ_SCAN',sku:scannedCode},
   'https://script.google.com'
  );
  statusText('تم إرسال الكود للنافذة الأصلية');
 }else{
  copyCode();
  statusText('لا توجد نافذة نظام مفتوحة. تم نسخ الكود بدلاً من ذلك.');
 }
}

async function copyCode(){
 if(!scannedCode)return;
 await navigator.clipboard.writeText(scannedCode);
 statusText('تم نسخ الكود ✅');
}

function statusText(message){
 document.getElementById('status').textContent=message;
}
</script>
</body>
</html>
